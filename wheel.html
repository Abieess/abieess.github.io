<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wheel of Names | Abies</title>
<meta name="description" content="A vintage spin-the-wheel name picker.">
<link rel="icon" href="assets/abies.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Noto+Serif+Tamil:wght@400;600&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="wheel.css">
</head>
<body>
<main>

  <header>
    <a href="index.html">Back home</a>
    <h1>Wheel of Names</h1>
    <p class="tagline">Write the names, give it a spin, and let fate decide.</p>
  </header>

  <div class="layout">

    <section class="stage" aria-label="The wheel">
      <div class="wheelbox">
        <canvas id="wheel" role="img" aria-label="Wheel of names"></canvas>
        <svg class="pin" id="pin" viewBox="0 0 40 56" aria-hidden="true">
          <path d="M20 54 L4.5 13 A17 17 0 1 1 35.5 13 Z" fill="#b8892b" stroke="#2a2018" stroke-width="2.5" stroke-linejoin="round"/>
          <circle cx="20" cy="17" r="5" fill="#2a2018"/>
        </svg>
      </div>
    </section>

    <section class="panel" aria-label="Names and controls">
      <h2>names</h2>
      <label for="names" class="sr">Names, one per line</label>
      <textarea id="names" rows="10" spellcheck="false" placeholder="One name on each line"></textarea>
      <p class="hint"><span id="count">0 names</span> &middot; one per line, up to 60</p>

      <div class="row">
        <button id="spin" class="primary" type="button">Spin the wheel</button>
        <button id="shuffle" type="button">Shuffle</button>
        <button id="clear" type="button">Clear</button>
      </div>

      <label class="opt"><input type="checkbox" id="remove"> Remove the winner after each spin</label>
      <label class="opt"><input type="checkbox" id="sound" checked> Tick sound</label>

      <div id="result" class="result" aria-live="polite" hidden></div>

      <h2>winners so far</h2>
      <ol id="history" class="history"></ol>
      <p class="hint" id="noHistory">Nobody has been picked yet.</p>
      <button id="clearHistory" type="button" class="small">Clear history</button>
    </section>

  </div>

  <footer>&copy; 2026 Abies</footer>
</main>
<script src="wheel.js"></script>
</body>
</html>
